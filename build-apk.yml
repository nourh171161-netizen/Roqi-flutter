name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.habits --project-name habits_app /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          sed -i 's/android:label="habits_app"/android:label="عاداتي فلاتر"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: habits-apk
          path: build/app/outputs/flutter-apk/app-release.apk
